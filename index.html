  <style>
    /* ================================================================
       MATERIAL 3 EXPRESSIVE — Design System
       Basado en Material Design 3 con enfoque Expressive (Google)
       ================================================================ */

    /* --- Reset & Base --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    /* --- M3 Color Tokens (Light) --- */
    :root {
      /* Primary */
      --md-primary: #6366f1;
      --md-on-primary: #ffffff;
      --md-primary-container: #e0e0ff;
      --md-on-primary-container: #1a1b6e;

      /* Secondary */
      --md-secondary: #ec4899;
      --md-on-secondary: #ffffff;
      --md-secondary-container: #ffe0ec;
      --md-on-secondary-container: #5c1138;

      /* Tertiary */
      --md-tertiary: #10b981;
      --md-on-tertiary: #ffffff;
      --md-tertiary-container: #d1fae5;
      --md-on-tertiary-container: #064e3b;

      /* Error */
      --md-error: #f43f5e;
      --md-on-error: #ffffff;
      --md-error-container: #ffe0e6;
      --md-on-error-container: #5c1120;

      /* Surface / Background */
      --md-surface: #fffbff;
      --md-surface-dim: #e0dde7;
      --md-surface-bright: #fffbff;
      --md-surface-container: #f0effa;
      --md-surface-container-high: #eae9f4;
      --md-surface-container-highest: #e4e3ef;
      --md-surface-container-low: #f6f5ff;
      --md-surface-container-lowest: #ffffff;
      --md-on-surface: #1c1b21;
      --md-on-surface-variant: #494659;

      /* Outline */
      --md-outline: #7a778a;
      --md-outline-variant: #cac6db;
      --md-scrim: #000000;

      /* Inverses */
      --md-inverse-surface: #313036;
      --md-inverse-on-surface: #f4effa;
      --md-inverse-primary: #c4bfff;

      /* Fixed accent colors */
      --md-warning: #f59e0b;
      --md-on-warning: #ffffff;

      /* --- M3 Typography --- */
      --md-title-large: 700 1.375rem/1.75rem 'Outfit', sans-serif;
      --md-title-medium: 600 1rem/1.5rem 'Outfit', sans-serif;
      --md-title-small: 600 0.875rem/1.25rem 'Outfit', sans-serif;
      --md-body-large: 400 1rem/1.5rem 'Inter', sans-serif;
      --md-body-medium: 400 0.875rem/1.25rem 'Inter', sans-serif;
      --md-body-small: 400 0.75rem/1rem 'Inter', sans-serif;
      --md-label-large: 600 0.875rem/1.25rem 'Inter', sans-serif;
      --md-label-medium: 600 0.75rem/1rem 'Inter', sans-serif;
      --md-label-small: 600 0.625rem/0.875rem 'Inter', sans-serif;

      /* Headings with Outfit (Expressive) */
      --md-display-large: 800 3.5rem/4rem 'Outfit', sans-serif;
      --md-display-medium: 800 2.75rem/3.25rem 'Outfit', sans-serif;
      --md-headline-large: 700 2rem/2.5rem 'Outfit', sans-serif;
      --md-headline-medium: 700 1.75rem/2.25rem 'Outfit', sans-serif;
      --md-headline-small: 700 1.5rem/2rem 'Outfit', sans-serif;

      /* --- M3 Shape --- */
      --md-shape-xs: 4px;
      --md-shape-sm: 8px;
      --md-shape-md: 12px;
      --md-shape-lg: 16px;
      --md-shape-xl: 24px;
      --md-shape-xxl: 28px;
      --md-shape-full: 9999px;

      /* --- M3 Elevation --- */
      --md-elevation-0: 0 0 0 0 transparent;
      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.04), 0 1px 2px 0 rgba(0,0,0,0.06);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.06), 0 1px 2px 0 rgba(0,0,0,0.08);
      --md-elevation-3: 0 4px 8px 3px rgba(0,0,0,0.06), 0 2px 3px 0 rgba(0,0,0,0.10);
      --md-elevation-4: 0 6px 12px 4px rgba(0,0,0,0.08), 0 2px 3px 0 rgba(0,0,0,0.12);
      --md-elevation-5: 0 8px 16px 5px rgba(0,0,0,0.10), 0 4px 4px 0 rgba(0,0,0,0.14);

      /* --- Spacing (8px grid) --- */
      --sp: 0.25rem;
      --sp-1: 0.5rem;
      --sp-2: 0.75rem;
      --sp-3: 1rem;
      --sp-4: 1.5rem;
      --sp-5: 2rem;
      --sp-6: 3rem;
      --sp-7: 4rem;

      /* --- Motion --- */
      --md-duration-fast: 100ms;
      --md-duration-medium: 250ms;
      --md-duration-slow: 400ms;
      --md-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
      --md-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
      --md-easing-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
    }

    /* --- M3 Color Tokens (Dark) --- */
    [data-color-scheme="dark"] {
      --md-primary: #c4bfff;
      --md-on-primary: #2b2994;
      --md-primary-container: #4947c8;
      --md-on-primary-container: #e0e0ff;

      --md-secondary: #ffb0cd;
      --md-on-secondary: #5c1138;
      --md-secondary-container: #a13160;
      --md-on-secondary-container: #ffe0ec;

      --md-tertiary: #64ddb7;
      --md-on-tertiary: #064e3b;
      --md-tertiary-container: #0d7a5a;
      --md-on-tertiary-container: #d1fae5;

      --md-error: #ffb3b8;
      --md-on-error: #5c1120;
      --md-error-container: #a1303c;
      --md-on-error-container: #ffe0e6;

      --md-surface: #13131a;
      --md-surface-dim: #13131a;
      --md-surface-bright: #3a3842;
      --md-surface-container: #201f27;
      --md-surface-container-high: #2b2a32;
      --md-surface-container-highest: #36353d;
      --md-surface-container-low: #1b1b23;
      --md-surface-container-lowest: #0e0e14;
      --md-on-surface: #e4e1ec;
      --md-on-surface-variant: #cac6db;

      --md-outline: #9491a4;
      --md-outline-variant: #494659;
      --md-inverse-surface: #e4e1ec;
      --md-inverse-on-surface: #313036;
      --md-inverse-primary: #6366f1;
    }

    /* --- Base Typography --- */
    body {
      font: var(--md-body-large);
      color: var(--md-on-surface);
      background: var(--md-surface);
      min-height: 100vh;
      transition: background var(--md-duration-medium) var(--md-easing-emphasized-decelerate),
                  color var(--md-duration-medium) var(--md-easing-emphasized-decelerate);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1 { font: var(--md-headline-large); margin-bottom: var(--sp-2); }
    h2 { font: var(--md-headline-medium); margin-bottom: var(--sp-2); }
    h3 { font: var(--md-headline-small); margin-bottom: var(--sp-1); }
    h4 { font: var(--md-title-large); margin-bottom: var(--sp-1); }

    /* --- Selection --- */
    ::selection { background: var(--md-primary-container); color: var(--md-on-primary-container); }

    /* ================================================================
       LAYOUT
       ================================================================ */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--sp-3);
      animation: fadeSlideIn var(--md-duration-slow) var(--md-easing-emphasized-decelerate);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(var(--sp-2)); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ================================================================
       M3 SURFACE (replaces glass-panel)
       ================================================================ */
    .glass-panel {
      background: var(--md-surface-container-low);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-lg);
      box-shadow: var(--md-elevation-1);
      padding: var(--sp-4);
      margin-bottom: var(--sp-4);
      transition: box-shadow var(--md-duration-medium) var(--md-easing-emphasized-decelerate),
                  transform var(--md-duration-medium) var(--md-easing-emphasized-decelerate);
    }
    .glass-panel:hover {
      box-shadow: var(--md-elevation-2);
    }

    /* ================================================================
       HEADER
       ================================================================ */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--sp-3) var(--sp-4);
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-xl);
      box-shadow: var(--md-elevation-1);
      margin-bottom: var(--sp-4);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }

    .logo {
      width: 48px;
      height: 48px;
      background: var(--md-primary-container);
      border-radius: var(--md-shape-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      position: relative;
      box-shadow: var(--md-elevation-1);
      transition: transform var(--md-duration-medium) var(--md-easing-emphasized-decelerate);
    }
    .logo:hover { transform: scale(1.08) rotate(-4deg); }
    .logo::before { content: "🃏"; position: absolute; }

    .header h1 {
      font: var(--md-headline-medium);
      background: linear-gradient(135deg, var(--md-primary), var(--md-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0;
    }

    .subtitle {
      font: var(--md-body-medium);
      color: var(--md-on-surface-variant);
    }

    .header-buttons {
      display: flex;
      gap: var(--sp-1);
      flex-wrap: wrap;
    }

    /* ================================================================
       M3 BUTTONS
       ================================================================ */
    .btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-1);
      padding: 0.625rem 1.25rem;
      font: var(--md-label-large);
      border: none;
      border-radius: var(--md-shape-full);
      cursor: pointer;
      transition: all var(--md-duration-medium) var(--md-easing-emphasized-decelerate);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: currentColor;
      opacity: 0;
      transition: opacity var(--md-duration-medium) var(--md-easing-emphasized);
    }
    .btn:hover::before { opacity: 0.08; }
    .btn:focus-visible::before { opacity: 0.12; }
    .btn:active::before { opacity: 0.16; }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--md-primary);
      color: var(--md-on-primary);
      box-shadow: var(--md-elevation-1);
    }
    .btn-primary:hover { box-shadow: var(--md-elevation-2); }

    .btn-secondary {
      background: transparent;
      color: var(--md-on-surface);
      border: 1px solid var(--md-outline);
    }
    .btn-secondary:hover { background: var(--md-surface-container-high); }

    .btn-tonal {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }
    .btn-tonal:hover { box-shadow: var(--md-elevation-1); }

    .btn-sm {
      padding: 0.375rem 0.75rem;
      font: var(--md-label-medium);
      min-width: 36px;
      min-height: 36px;
    }

    .btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .btn:disabled::before { display: none; }

    /* ================================================================
       CARD GRID
       ================================================================ */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: var(--sp-4);
      margin-bottom: var(--sp-4);
    }

    .card {
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-lg);
      padding: var(--sp-4);
    }

    /* ================================================================
       PLAYER INPUT
       ================================================================ */
    .player-input {
      display: flex;
      gap: var(--sp-2);
      margin-bottom: var(--sp-4);
    }
    .player-input input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: var(--md-surface-container-high);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-sm);
      color: var(--md-on-surface);
      font: var(--md-body-large);
      transition: all var(--md-duration-medium) var(--md-easing-emphasized-decelerate);
      outline: none;
    }
    .player-input input::placeholder { color: var(--md-on-surface-variant); }
    .player-input input:focus {
      border-color: var(--md-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 20%, transparent);
    }

    .player-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
      gap: var(--sp-3);
    }

    /* ================================================================
       PLAYER CARD
       ================================================================ */
    .player-card {
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-md);
      padding: var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      transition: transform var(--md-duration-medium) var(--md-easing-emphasized-decelerate),
                  box-shadow var(--md-duration-medium) var(--md-easing-emphasized-decelerate);
      position: relative;
      overflow: hidden;
    }
    .player-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--md-primary);
      border-radius: 0 var(--md-shape-xs) var(--md-shape-xs) 0;
      opacity: 0.6;
    }
    .player-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--md-elevation-2);
    }

    .player-info strong {
      font: var(--md-title-medium);
      color: var(--md-on-surface);
    }
    .player-info small {
      font: var(--md-body-small);
      color: var(--md-on-surface-variant);
      display: block;
      margin-top: var(--sp-1);
    }

    .player-badges {
      display: flex;
      gap: var(--sp-1);
      align-items: center;
      margin-top: var(--sp-1);
      flex-wrap: wrap;
    }

    .badge {
      font: var(--md-label-small);
      padding: 0.125rem 0.5rem;
      border-radius: var(--md-shape-full);
      color: var(--md-on-primary);
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .badge-dealer { background: var(--md-tertiary); color: var(--md-on-tertiary); }
    .badge-hand { background: var(--md-warning); color: #000000; }

    /* ================================================================
       ROUND HEADER (Expressive Banner)
       ================================================================ */
    .round-header {
      background: linear-gradient(135deg, var(--md-primary), var(--md-secondary));
      color: var(--md-on-primary);
      text-align: center;
      border: none;
      border-radius: var(--md-shape-xl);
      padding: var(--sp-5) var(--sp-4);
      margin-bottom: var(--sp-4);
      box-shadow: var(--md-elevation-2);
      position: relative;
      overflow: hidden;
    }
    .round-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      pointer-events: none;
    }
    .round-header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
      pointer-events: none;
    }
    .round-header h2 {
      font: var(--md-headline-large);
      letter-spacing: -0.02em;
      position: relative;
      z-index: 1;
    }

    /* ================================================================
       TABLES
       ================================================================ */
    .scoreboard-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--md-shape-md);
      margin: 0 calc(-1 * var(--sp-1));
      padding: 0 var(--sp-1);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: max(500px, 100%);
    }

    th, td {
      padding: 0.875rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--md-outline-variant);
      white-space: nowrap;
    }
    th {
      background: var(--md-surface-container-high);
      font: var(--md-label-medium);
      color: var(--md-on-surface-variant);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th:first-child { border-radius: var(--md-shape-sm) 0 0 0; }
    th:last-child { border-radius: 0 var(--md-shape-sm) 0 0; }

    tr:last-child td { border-bottom: none; }
    tr { transition: background var(--md-duration-fast) var(--md-easing-emphasized-decelerate); }
    tr:hover td { background: color-mix(in srgb, var(--md-primary) 4%, transparent); }

    .current-round {
      background: color-mix(in srgb, var(--md-primary) 10%, transparent) !important;
      color: var(--md-primary) !important;
    }
    .winner-row td {
      background: color-mix(in srgb, var(--md-tertiary) 6%, transparent) !important;
    }

    .score-input {
      width: clamp(56px, 10vw, 72px);
      padding: 0.5rem 0.375rem;
      background: var(--md-surface-container-high);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-xs);
      text-align: center;
      font: 600 0.875rem/1.25rem 'Inter', sans-serif;
      color: var(--md-on-surface);
      transition: all var(--md-duration-fast) var(--md-easing-emphasized-decelerate);
      outline: none;
      -moz-appearance: textfield;
    }
    .score-input::-webkit-inner-spin-button,
    .score-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .score-input:focus {
      border-color: var(--md-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 20%, transparent);
    }
    .score-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .negative-score {
      background: color-mix(in srgb, var(--md-tertiary) 12%, transparent) !important;
      color: var(--md-tertiary) !important;
      border-color: var(--md-tertiary) !important;
      font-weight: 700;
    }

    .total-score {
      font: 700 1rem/1.5rem 'Inter', sans-serif;
      text-align: center;
      color: var(--md-primary);
    }
    .player-name {
      font-weight: 500;
    }
    .position {
      font: var(--md-title-small);
      color: var(--md-on-surface-variant);
      text-align: center;
      width: 2rem;
    }

    /* ================================================================
       CONTROLS
       ================================================================ */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
      justify-content: center;
      margin-bottom: var(--sp-4);
    }

    /* ================================================================
       MODAL / OVERLAY (M3 Dialog)
       ================================================================ */
    .overlay {
      position: fixed;
      inset: 0;
      background: color-mix(in srgb, var(--md-scrim) 40%, transparent);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all var(--md-duration-medium) var(--md-easing-emphasized-decelerate);
      padding: var(--sp-3);
    }
    .overlay.show { opacity: 1; visibility: visible; }

    .modal-content {
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-shape-xxl);
      box-shadow: var(--md-elevation-3);
      padding: var(--sp-5);
      width: 100%;
      max-width: 560px;
      max-height: 85vh;
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: transform var(--md-duration-medium) var(--md-easing-emphasized);
    }
    .overlay.show .modal-content { transform: scale(1) translateY(0); }

    /* ================================================================
       RULES CONTENT (M3 Typography)
       ================================================================ */
    .rules-content {
      font: var(--md-body-large);
      color: var(--md-on-surface);
      line-height: 1.7;
    }
    .rules-content h1 {
      font: var(--md-headline-large);
      color: var(--md-primary);
      margin-bottom: var(--sp-3);
      border-bottom: 2px solid var(--md-outline-variant);
      padding-bottom: var(--sp-2);
    }
    .rules-content h2 {
      font: var(--md-headline-small);
      margin: var(--sp-4) 0 var(--sp-2);
    }
    .rules-content ul {
      padding-left: var(--sp-4);
      margin-bottom: var(--sp-3);
    }
    .rules-content li { margin-bottom: var(--sp-1); }
    .rules-content strong { color: var(--md-secondary); }

    /* ================================================================
       TOASTS (M3 Snackbar)
       ================================================================ */
    .toast-container {
      position: fixed;
      bottom: var(--sp-4);
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 400px;
      padding: 0 var(--sp-3);
      pointer-events: none;
    }
    .toast {
      background: var(--md-inverse-surface);
      color: var(--md-inverse-on-surface);
      padding: 0.875rem 1.25rem;
      border-radius: var(--md-shape-sm);
      box-shadow: var(--md-elevation-3);
      font: var(--md-body-medium);
      text-align: center;
      animation: toastAnim 3s var(--md-easing-emphasized) forwards;
      pointer-events: auto;
    }
    @keyframes toastAnim {
      0%   { opacity: 0; transform: translateY(16px) scale(0.95); }
      12%  { opacity: 1; transform: translateY(0) scale(1); }
      80%  { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(0.95); }
    }

    /* ================================================================
       TOOLTIPS
       ================================================================ */
    .tooltip {
      position: relative;
      display: inline-block;
    }
    .tooltip-text {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: var(--md-inverse-surface);
      color: var(--md-inverse-on-surface);
      padding: 0.375rem 0.75rem;
      border-radius: var(--md-shape-xs);
      font: var(--md-body-small);
      white-space: nowrap;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all var(--md-duration-fast) var(--md-easing-emphasized-decelerate);
      box-shadow: var(--md-elevation-2);
      pointer-events: none;
    }
    .tooltip-text::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -4px;
      border-width: 4px;
      border-style: solid;
      border-color: var(--md-inverse-surface) transparent transparent transparent;
    }
    .tooltip:hover .tooltip-text {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    /* ================================================================
       FOOTER
       ================================================================ */
    .footer {
      text-align: center;
      padding: var(--sp-4);
      color: var(--md-on-surface-variant);
      font: var(--md-body-small);
      margin-top: var(--sp-5);
      border-top: 1px solid var(--md-outline-variant);
    }

    /* ================================================================
       CHART
       ================================================================ */
    .chart-container {
      width: 100%;
      min-height: 250px;
    }
    .chart-container svg {
      width: 100% !important;
      height: auto !important;
    }

    /* ================================================================
       SCORING UI — Closer auto-indicator
       ================================================================ */
    .closer-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font: var(--md-label-small);
      background: color-mix(in srgb, var(--md-tertiary) 15%, transparent);
      color: var(--md-tertiary);
      padding: 2px 8px;
      border-radius: var(--md-shape-full);
      font-weight: 600;
    }
    .auto-score-tag {
      display: inline-block;
      font: var(--md-label-small);
      color: var(--md-on-surface-variant);
      background: var(--md-surface-container-high);
      padding: 1px 6px;
      border-radius: var(--md-shape-xs);
    }

    /* ================================================================
       DRAG & DROP
       ================================================================ */
    .player-card[draggable="true"] { cursor: grab; }
    .player-card[draggable="true"]:active { cursor: grabbing; }
    .player-card-dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }
    .player-card-drag-over {
      border-color: var(--md-primary) !important;
      box-shadow: 0 0 0 2px var(--md-primary) !important;
      transform: translateY(-2px);
    }
    .drag-handle {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--md-on-surface-variant);
      margin-right: 0.25rem;
      opacity: 0.6;
      letter-spacing: 2px;
      user-select: none;
    }
    .player-card[draggable="true"] .drag-handle { opacity: 0.8; }

    /* ================================================================
       RESPONSIVE — M3 Breakpoints
       ================================================================ */

    /* Extra small < 480px */
    @media (max-width: 479px) {
      .container { padding: var(--sp-2); }
      .header {
        flex-direction: column;
        text-align: center;
        gap: var(--sp-2);
        padding: var(--sp-2);
        border-radius: var(--md-shape-lg);
      }
      .header-left { flex-direction: column; gap: var(--sp-1); }
      .header h1 { font: var(--md-headline-small); }
      .header-buttons { justify-content: center; }
      .glass-panel { padding: var(--sp-3); border-radius: var(--md-shape-md); }
      .card-grid { grid-template-columns: 1fr; gap: var(--sp-3); }
      .player-list { grid-template-columns: 1fr; }
      .round-header { padding: var(--sp-3) var(--sp-2); }
      .round-header h2 { font: var(--md-headline-small); }
      th, td { padding: 0.5rem 0.375rem; font-size: 0.8125rem; }
      .score-input { width: 48px; padding: 0.375rem 0.25rem; font-size: 0.8125rem; }
      .controls { flex-direction: column; width: 100%; }
      .controls .btn { width: 100%; }
      .modal-content { padding: var(--sp-3); border-radius: var(--md-shape-lg); }
      .btn { padding: 0.5rem 1rem; }
      .player-input { flex-direction: column; }
      .logo { width: 40px; height: 40px; font-size: 1.25rem; }
      .player-card::before { width: 3px; }
    }

    /* Small 480-599px */
    @media (min-width: 480px) and (max-width: 599px) {
      .container { padding: var(--sp-2); }
      .header { padding: var(--sp-2) var(--sp-3); }
      .header h1 { font: var(--md-headline-small); }
      .glass-panel { padding: var(--sp-3); }
      .card-grid { gap: var(--sp-3); }
      .player-list { grid-template-columns: repeat(2, 1fr); }
      .controls { flex-direction: row; flex-wrap: wrap; }
      .controls .btn { flex: 1 1 auto; }
    }

    /* Medium 600-839px (tablet portrait) */
    @media (min-width: 600px) and (max-width: 839px) {
      .container { padding: var(--sp-3); }
      .player-list { grid-template-columns: repeat(2, 1fr); }
      .header h1 { font: var(--md-headline-medium); }
      .scoreboard-scroll table { min-width: 100%; }
      .scoreboard-scroll th,
      .scoreboard-scroll td { padding: 0.375rem 0.25rem; font-size: 0.6875rem; }
      .scoreboard-scroll .score-input { width: 36px; padding: 0.1875rem 0.125rem; font-size: 0.6875rem; }
      .scoreboard-scroll .total-score { font-size: 0.75rem; }
      .scoreboard-scroll .position { width: 1.25rem; font-size: 0.6875rem; }
      .scoreboard-scroll .player-name { font-size: 0.6875rem; }
      .scoreboard-scroll .badge { font-size: 0.5rem; padding: 0.0625rem 0.25rem; }
    }

    /* Large 840-1199px (tablet landscape / small desktop) */
    @media (min-width: 840px) and (max-width: 1199px) {
      .player-list { grid-template-columns: repeat(3, 1fr); }
    }

    /* Extra large ≥ 1200px (desktop) */
    @media (min-width: 1200px) {
      .container { padding: var(--sp-5); }
      .player-list { grid-template-columns: repeat(3, 1fr); }
      .glass-panel { padding: var(--sp-5); }
    }

    /* --- Landscape orientation fixes --- */
    @media (orientation: landscape) and (max-height: 500px) {
      .header { padding: var(--sp-1) var(--sp-3); margin-bottom: var(--sp-2); }
      .header h1 { font: var(--md-title-large); }
      .logo { width: 32px; height: 32px; font-size: 1rem; }
      .round-header { padding: var(--sp-2) var(--sp-3); }
      .round-header h2 { font: var(--md-headline-small); }
      .glass-panel { padding: var(--sp-2); margin-bottom: var(--sp-2); }
      .card-grid { gap: var(--sp-2); margin-bottom: var(--sp-2); }
      .footer { padding: var(--sp-2); }
    }

    /* --- Touch-friendly: larger tap targets on mobile --- */
    @media (pointer: coarse) {
      .btn { min-height: 44px; }
      .btn-sm { min-height: 40px; }
      .score-input { min-height: 40px; }
      th, td { min-height: 44px; }
    }

    /* --- Reduced motion --- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* --- Scrollbar styling --- */
    .modal-content::-webkit-scrollbar,
    .scoreboard-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .modal-content::-webkit-scrollbar-track,
    .scoreboard-scroll::-webkit-scrollbar-track { background: transparent; }
    .modal-content::-webkit-scrollbar-thumb,
    .scoreboard-scroll::-webkit-scrollbar-thumb {
      background: var(--md-outline-variant);
      border-radius: var(--md-shape-full);
    }
    .modal-content::-webkit-scrollbar-thumb:hover,
    .scoreboard-scroll::-webkit-scrollbar-thumb:hover { background: var(--md-outline); }
</style>
</head>

  <script src="dist/App.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
